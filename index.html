<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stickman — Level 1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <span id="level-label" class="label">Level 1</span>
  <span id="key-status" class="chip locked">No key</span>
</div>

<div id="hint">A / D or ← → move · W / ↑ / Space jump · cling to a wall and kick off it, again and again, to climb it · grab a lip and jump to pull yourself up, S to drop · find the key, then walk into the right edge of the map · R restart</div>

<div id="toast" class="hidden"></div>
<div id="banner" class="hidden"><div id="banner-text"></div></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
